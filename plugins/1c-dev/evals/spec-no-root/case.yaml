schema_version: "1.1"
name: spec-no-root
description: Без git и без файла настроек spec не сохраняет спеку по умолчанию, а спрашивает, куда её положить.
runs: 1
execution:
  prompt: |
    /1c-dev:spec
    Итог нашего обсуждения (обсуждение закончено, решения согласованы):
    - в справочник Номенклатура добавляем булев реквизит «ПодЗаказ» расширением;
    - флаг на форме элемента выводим программно через &После ПриСозданииНаСервере;
    - движений нет, обмены не затрагиваем, право даём в роли расширения.
    Выгрузки конфигурации здесь нет, это нормально. Точку врезки и документ я подтверждаю заранее.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: nothing-saved
    type: file_exists
    path: "**/*.md"
    exists: false
  - name: asks-where
    type: llm
    criteria: |
      Ответ проходит, если выполнено всё:
      1. Агент не сохранил спеку в файл.
      2. Агент объясняет, что корень проекта не определён (нет git-репозитория и нет файла настроек),
         и спрашивает, куда сохранить спеку.
