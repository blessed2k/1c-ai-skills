schema_version: "1.1"
name: step-final-review
description: step после последнего шага агента запускает итоговое ревью задачи с осями «Спека целиком» и «Пользователь».
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/1c-dev:step"
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: did-the-step
    type: file_exists
    path: "docs/step2.txt"
  - name: whole-spec-axis
    type: regex
    pattern: "Спека целиком"
  - name: user-axis
    type: regex
    pattern: "Пользователь"
