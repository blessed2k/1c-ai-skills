schema_version: "1.1"
name: setup-hint
description: Без файлов настроек скилл работает на умолчаниях и подсказывает /1c-dev:setup.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/1c-dev:step"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: hints-setup
    type: regex
    pattern: "1c-dev:setup"
