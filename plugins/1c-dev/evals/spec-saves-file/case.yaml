schema_version: "1.1"
name: spec-saves-file
description: Спека по готовому обсуждению сохраняется в папку по умолчанию docs/specs.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /1c-dev:spec
    Итог нашего обсуждения (обсуждение закончено, решения согласованы):
    - в справочник Номенклатура добавляем булев реквизит «ПодЗаказ» расширением «ПодЗаказ»;
    - на форме элемента флаг выводим программно в ПриСозданииНаСервере через &После;
    - движений нет, обмены не затрагиваем;
    - право на реквизит даём в роли расширения, чтение и изменение;
    - проверка: YAxUnit на заполнение и ручная проверка под ролью.
    Выгрузки конфигурации в проекте нет, это нормально, отметь это в контуре.
    Точку врезки и итоговый документ я подтверждаю заранее: сохраняй спеку сразу, без вопросов.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: saved-in-default-dir
    type: file_exists
    path: "docs/specs/*.md"
  - name: no-other-md
    type: file_exists
    path: "{*.md,.claude/**/*.md}"
    exists: false
