schema_version: "1.1"
name: grill-facts-self
description: grill сам читает выгрузку и спрашивает только решения, с рекомендацией у каждого вопроса.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/1c-dev:grill Нужно помечать партнёров как ключевых и показывать это в списке партнёров."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: knows-dump-facts
    type: regex
    pattern: "ИНН"
  - name: decisions-not-facts
    type: llm
    criteria: |
      Оцени только последний ответ агента. Он проходит, если выполнено всё:
      1. Есть хотя бы один пронумерованный вопрос, и у каждого вопроса агент даёт свой рекомендуемый
         ответ.
      2. Вопросы просят пользователя принять решение (что и как делать), а не сообщить сведения о
         конфигурации. Какие именно решения спрошены первыми, не важно.
      3. Агент не спрашивает, какие реквизиты уже есть у справочника Партнеры, а сам называет хотя
         бы один реквизит из выгрузки (ИНН, Поставщик или Клиент) как установленный факт.
      4. Агент не пишет код и не создаёт спеку.
