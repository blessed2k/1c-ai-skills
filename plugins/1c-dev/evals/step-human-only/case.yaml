schema_version: "1.1"
name: step-human-only
description: Если в спеке остались только шаги человека, step перечисляет их и останавливается, не отправляя в spec или tickets.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/1c-dev:step"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: step-still-open
    type: regex
    pattern: "- \\[ \\] 1\\."
    target: {source: file, path: docs/specs/min-ceny.md}
  - name: waits-for-human
    type: llm
    criteria: |
      Ответ проходит, если выполнено всё:
      1. Агент перечисляет незакрытый шаг про включение константы минимальных цен и его проверку.
      2. Агент говорит, что шаг выполняет человек, и сам его не выполняет.
      3. Агент не предлагает заново писать спеку или разбивать задачу на шаги.
