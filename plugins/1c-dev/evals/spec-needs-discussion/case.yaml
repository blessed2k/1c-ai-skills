schema_version: "1.1"
name: spec-needs-discussion
description: spec без состоявшегося обсуждения не сочиняет спеку, а отправляет в grill.
runs: 1
execution:
  prompt: "/1c-dev:spec"
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
graders:
  - name: points-to-grill
    type: regex
    pattern: "1c-dev:grill"
  - name: no-spec-file
    type: file_exists
    path: "**/*.md"
    exists: false
