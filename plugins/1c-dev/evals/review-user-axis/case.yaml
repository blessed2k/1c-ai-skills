schema_version: "1.1"
name: review-user-axis
description: review глазами пользователя находит кнопку, которую видит только администратор, и текст ошибки, который не дойдёт до человека, и даёт список ручной проверки не под администратором.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/1c-dev:review проверь глазами пользователя: изменение в папке src, спека docs/specs/srochny-schet.md"
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: hidden-error-text
    type: regex
    pattern: "непредвиденн"
    flags: i
  - name: user-defects
    type: llm
    criteria: |
      Оцени итоговый отчёт агента. Он проходит, если выполнено всё:
      1. Агент говорит, что у роли Бухгалтер нет права просмотра (View) на команду
         ОтметитьСрочным, поэтому бухгалтер не увидит кнопку «Отметить срочным».
      2. Агент говорит, что исключение с категорией ОшибкаКонфигурации скроет текст про
         оплаченный счёт: человек увидит общую фразу о непредвиденной ошибке вместо этого текста.
      3. В отчёте есть список ручной проверки, и в нём сказано входить под бухгалтером или
         обычным пользователем, а не под администратором.
