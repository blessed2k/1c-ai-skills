schema_version: "1.1"
name: k-client-server
runs: 2
execution:
  prompt: |
    Проверь модуль формы по стандартам 1С, перечисли нарушения и исправления:

    ```bsl
    &НаКлиенте
    Процедура ПриОткрытии(Отказ)
    	Заголовок = ПолучитьЗаголовокНаСервере(Объект.Ссылка);
    КонецПроцедуры

    &НаСервереБезКонтекста
    Функция ПолучитьЗаголовокНаСервере(Ссылка)
    	Возврат "Договор " + Ссылка.Номер;
    КонецФункции

    &НаКлиенте
    Процедура Закрыть(Команда)
    	Если Объект.Дата > ДатаЗапрета Тогда
    		ЗакрытьДоговорНаСервере();
    	КонецЕсли;
    КонецПроцедуры

    &НаСервере
    Процедура ЗакрытьДоговорНаСервере()
    	ДоговорОбъект = РеквизитФормыВЗначение("Объект");
    	ДоговорОбъект.Закрыт = Истина;
    	ДоговорОбъект.Записать();
    КонецПроцедуры
    ```
  max_turns: 8
  allowed_tools: [Read, Grep, Glob, Skill]
graders:
  - name: finds-all
    type: llm
    criteria: |
      Оцени последний ответ. Проходит, если названы все три проблемы:
      1. серверный вызов в ПриОткрытии: данные надо получить в ПриСозданииНаСервере;
      2. параметр серверной функции без Знач (или шире: параметры серверных методов, вызываемых с клиента, объявлять с Знач);
      3. проверка даты запрета выполняется только на клиенте, а серверную процедуру формы можно вызвать в обход неё: проверку надо повторить на сервере.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "bsl-standards"
    arm: with-only
