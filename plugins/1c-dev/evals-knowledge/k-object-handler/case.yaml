schema_version: "1.1"
name: k-object-handler
runs: 2
execution:
  prompt: "Напиши обработчик ПередЗаписью в модуле объекта документа ЗаказКлиента: если СуммаДокумента не больше нуля, документ не записывать и сообщить пользователю. Только код обработчика."
  max_turns: 8
  allowed_tools: [Read, Grep, Glob, Skill]
graders:
  - name: exchange-load-check
    type: regex
    pattern: "ОбменДанными\\.Загрузка"
  - name: no-exception-in-code
    type: llm
    criteria: |
      Оцени только код обработчика в последнем ответе (пояснения вне кода не учитывай).
      Проходит, если выполнено всё:
      1. в коде нет оператора ВызватьИсключение;
      2. пользователь получает сообщение об ошибке;
      3. запись отменяется через параметр Отказ: присваиванием Отказ = Истина или передачей Отказ
         последним параметром в ОбщегоНазначения.СообщитьПользователю (или аналог БСП), которая
         сама его устанавливает.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "bsl-standards"
    arm: with-only
