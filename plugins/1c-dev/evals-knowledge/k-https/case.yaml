schema_version: "1.1"
name: k-https
runs: 2
execution:
  prompt: "Конфигурация без БСП. Напиши серверный код GET-запроса к https://api.example.com/rates с разбором ответа как строки. Только код."
  max_turns: 8
  allowed_tools: [Read, Grep, Glob, Skill]
graders:
  - name: server-verified
    type: regex
    pattern: "СертификатыУдостоверяющихЦентровОС"
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "bsl-standards"
    arm: with-only
