schema_version: "1.1"
name: k-skeleton-object
runs: 2
execution:
  prompt: "Дай каркас модуля объекта документа по стандарту структуры модуля 1С. Только области, без процедур."
  max_turns: 8
  allowed_tools: [Read, Grep, Glob, Skill]
graders:
  - name: region-order
    type: regex
    pattern: "ОписаниеПеременных[\\s\\S]*ПрограммныйИнтерфейс[\\s\\S]*ОбработчикиСобытий[\\s\\S]*СлужебныйПрограммныйИнтерфейс[\\s\\S]*СлужебныеПроцедурыИФункции[\\s\\S]*Инициализация"
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "bsl-module-skeleton"
    arm: with-only
