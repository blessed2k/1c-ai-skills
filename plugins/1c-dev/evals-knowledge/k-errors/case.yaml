schema_version: "1.1"
name: k-errors
runs: 2
execution:
  prompt: "Конфигурация на БСП 3.1, платформа 8.3.27. Напиши серверную функцию, которая получает файл по HTTP через уже созданное HTTPСоединение. При ошибке соединения нужно добавить понятное пользователю пояснение, записать подробности в журнал регистрации и пробросить исключение дальше. Только код."
  max_turns: 8
  allowed_tools: [Read, Grep, Glob, Skill]
graders:
  - name: detailed-representation
    type: regex
    pattern: "ОбработкаОшибок\\.ПодробноеПредставлениеОшибки\\("
  - name: no-legacy-description
    type: regex
    pattern: "ОписаниеОшибки\\(\\)|ИнформацияОбОшибке\\(\\)\\.(Подробное|Краткое)ПредставлениеОшибки"
    match: not_contains
  - name: clarified-rethrow
    type: regex
    pattern: "УточнениеИсключения|СообщениеОбОшибкеДляПользователя"
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "bsl-standards"
    arm: with-only
