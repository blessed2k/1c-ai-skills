schema_version: "1.1"
name: k-files
runs: 2
execution:
  prompt: "Конфигурация на БСП 3.1. В форме обработки по команде ЗагрузитьCSV пользователь выбирает CSV-файл на своём компьютере, после чего сервер разбирает его и заполняет табличную часть Строки. Напиши только каркас: клиентскую процедуру команды, обработчик завершения выбора и серверную процедуру, которая получает данные файла (сам разбор строк CSV замени комментарием). Только код."
  max_turns: 8
  timeout_seconds: 900
  allowed_tools: [Read, Grep, Glob, Skill]
graders:
  - name: upload-api
    type: regex
    pattern: "ФайловаяСистемаКлиент\\.ЗагрузитьФайл|ПоместитьФайлНаСерверАсинх|НачатьПомещениеФайлаНаСервер"
  - name: no-path-to-server
    type: llm
    criteria: |
      Оцени код в последнем ответе. Проходит, если ни одна процедура или функция с директивой
      &НаСервере или &НаСервереБезКонтекста не принимает параметром путь или имя файла на диске:
      на сервер передаётся адрес во временном хранилище (или двоичные данные), и сервер читает
      данные оттуда. Если серверный метод получает путь к файлу, не проходит.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "bsl-standards"
    arm: with-only
